name          = "curate"
one_line      = "库房维护：自动打标签、附件改名、清重复、补元数据"
expose        = "prompt"
costs_money   = true            # 自动打标签要大模型
side_effects  = ["写Zotero（标签/改名/删除条目）", "写 data/curated/<key>/meta.json"]
requires_role = "prod"
prompts       = ["autotag@v1"]

# ── 允许模型自己发起的入口（2026-09-01 加）─────────────────────────────
# **留空 = 一个都不许**，模型只能通过 prompt 请你来点。
# 判据是**代价的量级与可逆性**，不是「花不花钱」：
#   单次、便宜、可重来        → 可以进这里（调用时客户端强制弹窗，且没有「不再询问」）
#   全库作业 / 不可逆写 Zotero → 一律不许，留给人点
# 注册成 tool 的名字必须都在这张表里，且必须带 confirm —— registry.check() 强制。
agent_tools   = []   # 改名/删条目/改标签都是不可逆写库，一律人点
