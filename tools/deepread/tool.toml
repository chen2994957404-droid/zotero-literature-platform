name          = "deepread"
one_line      = "一篇文献 → 中文图文精读报告（含 SI 合并）"
expose        = "prompt"
costs_money   = true            # MineRU 解析额度 + 云端大模型长文输出
side_effects  = ["写Zotero（回写精读附件与状态标签）", "写 data/raw/<key>/ 与 data/curated/<key>/"]
requires_role = "prod"
prompts       = ["main@v2", "si@v1"]

# ── 允许模型自己发起的入口（2026-09-01 加）─────────────────────────────
# **留空 = 一个都不许**，模型只能通过 prompt 请你来点。
# 判据是**代价的量级与可逆性**，不是「花不花钱」：
#   单次、便宜、可重来        → 可以进这里（调用时客户端强制弹窗，且没有「不再询问」）
#   全库作业 / 不可逆写 Zotero → 一律不许，留给人点
# 注册成 tool 的名字必须都在这张表里，且必须带 confirm —— registry.check() 强制。
agent_tools   = ["deepread_request"]
# 「精读一篇」仍然不在这里：它要跑几分钟，会超过 MCP 约 60 秒的调用上限，
# 当不了同步 tool。硬做成「后台发起 + 轮询」只是把复杂度搬给模型。
#
# 开的是 `deepread_request` = **打「待处理」标签**（2026-09-10）。
# 判据仍是那条「单次、便宜、可重来」——打标签本身就是这三样，
# 而且用户本来就是这么用的（这是平台设计好的触发方式，不是新开的后门）。
#
# ⚠ 它的特殊之处：**便宜的动作会引出昂贵的后果**（watcher 随后真的去精读）。
# 这一点靠两道闸兜住：客户端每次弹窗（confirm），以及**服务端的当日额度闸**
# （`shared.kernel.budget`，装在 llm_client 上）。后者才是硬的 ——
# MCP 的 confirm 是 Claude Code 专有标记，换个客户端会被直接忽略。
#
# 为什么开：2026-09-10 外部 agent 在看不见本工具包的情况下，
# 自己读代码打标签精读了 10 篇。堵不住就给正规入口。
