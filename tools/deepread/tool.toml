name          = "deepread"
one_line      = "一篇文献 → 中文图文精读报告（含 SI 合并）"
expose        = "prompt"
costs_money   = true            # MineRU 解析额度 + 云端大模型长文输出
side_effects  = ["写 data/raw/<key>/ 与 data/curated/<key>/"]
requires_role = "prod"
prompts       = ["main@v2", "si@v1", "si@v2", "si@v3", "si_materials@v1", "si_synthesis@v1", "si_methods@v1", "si_figures@v1", "si_materials@v2", "si_synthesis@v2", "si_methods@v2", "si_figures@v2", "lead@v1", "exp@v1", "fig@v1", "wrap@v1", "lead@v2", "exp@v2", "fig@v2", "wrap@v2", "exp@v3", "fig@v3", "review_claims@v1", "review_keypoints@v1", "review_cover@v1", "units@v1", "units_src@v1", "units_match@v1"]

# ── 允许模型自己发起的入口（2026-09-01 加）─────────────────────────────
# **留空 = 一个都不许**，模型只能通过 prompt 请你来点。
# 判据是**代价的量级与可逆性**，不是「花不花钱」：
#   单次、便宜、可重来        → 可以进这里（调用时客户端强制弹窗，且没有「不再询问」）
#   全库作业 / 不可逆写 → 一律不许，留给人点
# 注册成 tool 的名字必须都在这张表里，且必须带 confirm —— registry.check() 强制。
agent_tools   = []
# 「精读一篇」不在这里：它要跑几分钟，超过 MCP 约 60 秒的调用上限，当不了同步 tool。
# 原来开着的 `deepread_request`（打 Zotero「待处理」标签排队）2026-10-13 随 Zotero 移出平台删了；
# 单篇精读在文献库应用里点（host/app），那边有确认框，花费上限由服务端的 budget 闸兜着。
