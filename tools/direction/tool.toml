name          = "direction"
one_line      = "方向地图：一条窄带里谁做了什么、有哪些簇、空白在哪"
expose        = "prompt"
costs_money   = true            # brainstorm 要大模型；建图本身走 OpenAlex（免费但很慢）
side_effects  = ["写 data/serving/direction/<窄带>.db"]
requires_role = "none"
prompts       = ["brainstorm@v1"]

# ── 允许模型自己发起的入口（2026-09-01 加）─────────────────────────────
# **留空 = 一个都不许**，模型只能通过 prompt 请你来点。
# 判据是**代价的量级与可逆性**，不是「花不花钱」：
#   单次、便宜、可重来        → 可以进这里（调用时客户端强制弹窗，且没有「不再询问」）
#   全库作业 / 不可逆写 Zotero → 一律不许，留给人点
# 注册成 tool 的名字必须都在这张表里，且必须带 confirm —— registry.check() 强制。
agent_tools   = []   # 建图是几百次请求、十几分钟的全库作业
