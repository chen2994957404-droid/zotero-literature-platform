name          = "extract"
one_line      = "一批文献 → 统一 schema 的结构化字段 + 横向对比表"
expose        = "prompt"
costs_money   = true            # 每篇都过一次云端大模型（--local 走本地则不花钱）
side_effects  = ["写 data/serving/structured/<key>.json 与 compare*.md"]
requires_role = "prod"          # 全库抽取是全库作业
prompts       = ["main@v1", "eval@v1"]

# ── 允许模型自己发起的入口（2026-09-01 加）─────────────────────────────
# **留空 = 一个都不许**，模型只能通过 prompt 请你来点。
# 判据是**代价的量级与可逆性**，不是「花不花钱」：
#   单次、便宜、可重来        → 可以进这里（调用时客户端强制弹窗，且没有「不再询问」）
#   全库作业 / 不可逆写 Zotero → 一律不许，留给人点
# 注册成 tool 的名字必须都在这张表里，且必须带 confirm —— registry.check() 强制。
agent_tools   = ["extract_one"]      # 抽一篇：单次；全库重抽仍是 prompt
