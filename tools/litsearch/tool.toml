# 工具清单（格式见 REBUILD.md 第二节；读它的是 host/mcp/registry.py）
#   costs_money / side_effects / requires_role 描述**这个工具最危险的那条路径**，
#   哪怕那条路径只在命令行上有、没暴露给 MCP —— 写清楚才有意义。
#   expose 是它在 MCP 上的主暴露方式，判据：只读且便宜→tool；只读数据→resource；
#   花钱或有副作用→prompt。花钱/有副作用的注册成 tool 会被 registry.check() 拦下。
#
# 本包**最危险的路径也只是「联网读公开 API」**：不写 Zotero、不调大模型。
# 所以它有资格当不弹窗的 tool —— 对抗式检索一轮要调十几次，每次弹窗这个用法就废了。
#
# 2026-09-26 加了两样，判断仍是 costs_money=false / side_effects=[]，理由写在这里：
#   · 语义检索每次 $0.001（OpenAlex 按量计费），免费 key 每天 $1 ≈ 1000 次；
#     一次调用最多 8 次，超额时 OpenAlex 回 429，沿用现有退路与提示 —— 与原来的列表查询同一档
#   · 检索台账只写 state/searches/ 下自己的 json（可重建层，删了只丢历史），
#     与本包原有的检索日志同一类，不碰 Zotero、不碰证据库
name          = "litsearch"
one_line      = "多轮全面检索的原料通道 + 台账：精确检索 / 按意思检索 / 取摘要 / 多篇雪球 / 记账判相关、看饱和、挖新说法"
expose        = "tool"
costs_money   = false
side_effects  = []
requires_role = "none"
prompts       = []
